{% load static %}

<div class="dropdown notifications-dropdown">
    <button class="btn btn-outline-light position-relative" type="button" id="notificationsDropdown"
            data-bs-toggle="dropdown">
        <i class="fas fa-bell"></i>
        <span class="position-absolute top-0 start-80 translate-middle badge rounded-pill bg-danger"
              id="notificationBadge" style="display: none;">0</span>
    </button>
    <div class="dropdown-menu dropdown-menu-end p-0">
        <div class="dropdown-header bg-light d-flex justify-content-between align-items-center py-2">
            <span class="fw-bold"><i class="fas fa-bell me-2"></i>Уведомления</span>
            <button class="btn btn-sm btn-link" onclick="markAllNotificationsRead(); return false;">Прочитать все
            </button>
        </div>
        <div class="dropdown-divider m-0"></div>
        <div id="notificationsList">
            <div class="text-center py-4">
                <div class="spinner-border spinner-border-sm text-primary"></div>
                <p class="text-muted small mt-2">Загрузка...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Загрузка уведомлений
    function loadNotifications() {
        fetch('/notifications/api/')
            .then(response => response.json())
            .then(data => {
                const badge = document.getElementById('notificationBadge');
                if (data.unread_count > 0) {
                    badge.textContent = data.unread_count;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }

                const list = document.getElementById('notificationsList');
                if (data.notifications?.length) {
                    list.innerHTML = data.notifications.map(n => `
                    <div class="dropdown-item notification-item ${n.is_read ? '' : 'unread'}"
                         data-id="${n.id}"
                         onclick="markNotificationRead(${n.id})">
                        <div class="d-flex">
                            <div class="me-2">✅</div>
                            <div>
                                <div class="d-flex justify-content-between">
                                    <strong class="small">${n.title}</strong>
                                    <small class="text-muted ms-2">${n.created_at}</small>
                                </div>
                                <p class="small text-muted mb-1">${n.message}</p>
                                <small class="text-primary">Задача #${n.task_id}</small>
                            </div>
                        </div>
                    </div>
                `).join('');
                } else {
                    list.innerHTML = '<div class="text-center py-4 text-muted">Нет уведомлений</div>';
                }
            })
            .catch(error => console.error('Ошибка:', error));
    }

    // Отметить одно уведомление
    function markNotificationRead(id) {
        fetch(`/notifications/api/${id}/read/`, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) loadNotifications();
            });
    }

    // Отметить все
    function markAllNotificationsRead() {
        fetch('/notifications/api/read-all/', {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) loadNotifications();
            });
    }

    // Загружаем при старте
    document.addEventListener('DOMContentLoaded', loadNotifications);
    setInterval(loadNotifications, 30000);
</script>

<style>
    .notification-item {
        padding: 10px 15px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .notification-item:hover {
        background-color: #f8f9fa;
    }

    .notification-item.unread {
        background-color: #e3f2fd;
    }

    #notificationBadge {
        font-size: 0.6rem;
        padding: 2px 5px;
    }
</style>
