{% extends 'base.html' %}
{% load static %}
{% load pluralize_ru %}

{% block extra_css %}
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="{% static 'task_description_app/css/task_description.css' %}">
{% endblock %}

{% block content %}
    <div class="row task-container">
        <!-- Левая панель -->
        <div class="col-md-3 sidebar">
            <div class="sidebar-header">
                <span>📁 Задачи</span>
                <span id="totalTasks">{{ total_tasks }}</span>
            </div>
            <div class="tree-container">
                <ul class="tree" id="tree"></ul>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="col-md-5 list-content">
            <div class="list-content-header">
                <div class="path" id="currentPath"></div>
                <h2 id="currentTitle">Выберите задачу</h2>
            </div>
            <div class="list-content-body" id="taskContent">
                <div class="empty">
                    👈 Выберите задачу в дереве слева
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // Данные дерева из контекста
        const treeData = {{ tree_data|safe }};

        // Состояние развернутых узлов
        const expandedNodes = new Set();

        // Функция для построения дерева
        function renderTree(container, data) {
            container.innerHTML = '';

            function createNode(node, path = []) {
                const li = document.createElement('li');
                const currentPath = [...path, node.name];
                const pathStr = currentPath.join('/');

                const div = document.createElement('div');
                div.className = 'node';
                div.setAttribute('data-path', pathStr);

                // Определяем иконку
                let icon = '📁';
                if (node.name.includes('класс')) icon = '📚';
                else if (node.name.includes('Тема')) icon = '📖';
                else if (node.name.includes('Урок')) icon = '📝';
                else if (node.name.includes('Уровень_')) icon = '📊';

                // Стрелка
                const arrow = document.createElement('span');
                arrow.className = 'arrow';

                const hasChildren = (node.children && node.children.length > 0) ||
                    (node.tasks && node.tasks.length > 0);

                if (hasChildren) {
                    arrow.textContent = expandedNodes.has(pathStr) ? '▼' : '▶';
                } else {
                    arrow.textContent = '';
                }

                div.appendChild(arrow);

                // Иконка
                const iconSpan = document.createElement('span');
                iconSpan.className = 'icon';
                iconSpan.textContent = icon;
                div.appendChild(iconSpan);

                // Название
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = node.name;
                div.appendChild(nameSpan);

                // Счетчик задач
                if (node.tasks && node.tasks.length > 0) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = node.tasks.length;
                    div.appendChild(count);
                }

                div.onclick = function (e) {
                    e.stopPropagation();
                    toggleNode(this, pathStr, hasChildren);
                };

                li.appendChild(div);

                // Добавляем детей (узлы структуры)
                if (node.children && node.children.length > 0) {
                    const ul = document.createElement('ul');
                    if (!expandedNodes.has(pathStr)) {
                        ul.style.display = 'none';
                    }

                    node.children.forEach(child => {
                        ul.appendChild(createNode(child, currentPath));
                    });

                    li.appendChild(ul);
                }

                // Добавляем задачи
                if (node.tasks && node.tasks.length > 0) {
                    const ul = document.createElement('ul');
                    if (!expandedNodes.has(pathStr)) {
                        ul.style.display = 'none';
                    }

                    node.tasks.forEach(task => {
                        const taskLi = document.createElement('li');
                        const taskDiv = document.createElement('div');
                        taskDiv.className = 'node task';
                        taskDiv.setAttribute('data-task-id', task.id);

                        taskDiv.innerHTML = `
                            <span class="arrow"></span>
                            <span class="icon">📄</span>
                            <span class="name">${task.name}</span>
                        `;

                        taskDiv.onclick = function (e) {
                            e.stopPropagation();
                            selectTask(task.id);
                        };

                        taskLi.appendChild(taskDiv);
                        ul.appendChild(taskLi);
                    });

                    li.appendChild(ul);
                }

                return li;
            }

            // Строим дерево
            data.forEach(node => {
                container.appendChild(createNode(node));
            });
        }

        // Переключение узла
        function toggleNode(element, path, hasChildren) {
            if (!hasChildren) return;

            const li = element.closest('li');
            const ul = li.querySelector(':scope > ul');

            if (ul) {
                if (ul.style.display === 'none') {
                    ul.style.display = 'block';
                    expandedNodes.add(path);
                    element.querySelector('.arrow').textContent = '▼';
                } else {
                    ul.style.display = 'none';
                    expandedNodes.delete(path);
                    element.querySelector('.arrow').textContent = '▶';
                }
            }

            // Подсветка выбранного элемента
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Выбор задачи
        async function selectTask(taskId) {
            // Подсветка
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
            if (taskElement) {
                taskElement.classList.add('selected');
            }

            // Показываем загрузку
            document.getElementById('currentTitle').innerHTML = 'Загрузка...';
            document.getElementById('taskContent').innerHTML = `
        <div class="loader-container">
            <span class="loading"></span> Загрузка задачи...
        </div>
    `;

            try {
                // ИСПРАВЛЕНО: правильный URL для API
                const response = await fetch(`/tasks/api/task/${taskId}/`);

                if (!response.ok) {
                    throw new Error(`Ошибка загрузки: ${response.status}`);
                }

                const task = await response.json();

                // Обновляем путь
                document.getElementById('currentPath').innerHTML = `Задача #${task.id}`;
                document.getElementById('currentTitle').innerHTML = task.title || `Задача #${task.id}`;

                // Конвертируем Markdown в HTML
                const htmlContent = task.md_content ? marked.parse(task.md_content) : '<p>Нет описания</p>';

                const checkUrl = `/tasks/task/${task.id}/`;

                document.getElementById('taskContent').innerHTML = `
            <div>
                <div class="markdown-content">
                    ${htmlContent}
                </div>
                <a href="${checkUrl}" class="btn btn-primary mt-3">
                    ✅ Проверить решение
                </a>
            </div>
        `;

                // Подсветка синтаксиса
                if (typeof hljs !== 'undefined') {
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                }

            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('taskContent').innerHTML = `
            <div class="error-message">
                <h3>❌ Ошибка загрузки задачи</h3>
                <p>${error.message}</p>
                <p>Проверьте соединение и попробуйте снова.</p>
            </div>
        `;
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function () {
            const treeContainer = document.getElementById('tree');
            if (treeContainer && treeData) {
                renderTree(treeContainer, treeData);

                // Разворачиваем первый уровень для демо
                setTimeout(() => {
                    const firstNode = document.querySelector('.tree > li > .node');
                    if (firstNode) {
                        firstNode.click();
                    }
                }, 100);
            }
        });
    </script>
{% endblock %}
