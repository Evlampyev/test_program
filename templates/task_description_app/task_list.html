        // Функция для загрузки содержимого task.md
        async function loadTaskContent(taskPath) {
            try {
                // Формируем путь к файлу task.md
                // Предполагается, что файлы лежат в папке tasks_for_tests
                const mdPath = `/tasks_for_tests/${taskPath}/task.md`;

                const response = await fetch(mdPath);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const content = await response.text();
                return content;
            } catch (error) {
                console.error('Error loading task.md:', error);
                throw error;
            }
        }

        // Функция для построения дерева
        function renderTree(container, data, parent = null) {
            container.innerHTML = '';

            function createNode(key, value, level = 0, path = []) {
                const li = document.createElement('li');
                const currentPath = [...path, key];
                const pathStr = currentPath.join('/');

                const div = document.createElement('div');
                div.className = 'node';
                div.setAttribute('data-path', pathStr);

                // Определяем иконку
                let icon = '📁';
                if (key.includes('класс')) icon = '📚';
                else if (key.includes('Тема')) icon = '📖';
                else if (key.includes('Урок')) icon = '📝';
                else if (key.includes('level_')) icon = '📊';

                // Стрелка
                const arrow = document.createElement('span');
                arrow.className = 'arrow';

                // Проверяем, есть ли дети
                const hasChildren = Array.isArray(value) ? value.length > 0 :
                    (typeof value === 'object' && value !== null && Object.keys(value).length > 0);

                if (hasChildren) {
                    arrow.textContent = '▶';
                } else {
                    arrow.textContent = '';
                }

                div.appendChild(arrow);

                // Иконка
                const iconSpan = document.createElement('span');
                iconSpan.className = 'icon';
                iconSpan.textContent = icon;
                div.appendChild(iconSpan);

                // Название
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = key;
                div.appendChild(nameSpan);

                // Счетчик для списка задач
                if (Array.isArray(value)) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = value.length;
                    div.appendChild(count);
                }

                div.onclick = function (e) {
                    e.stopPropagation();
                    handleNodeClick(this, key, value, currentPath);
                };

                li.appendChild(div);

                // Добавляем детей
                if (hasChildren) {
                    const ul = document.createElement('ul');

                    if (Array.isArray(value)) {
                        // Это список задач
                        value.forEach(task => {
                            const taskLi = document.createElement('li');
                            const taskDiv = document.createElement('div');
                            taskDiv.className = 'node task';
                            taskDiv.setAttribute('data-path', [...currentPath, task].join('/'));

                            taskDiv.innerHTML = `
                                <span class="arrow"></span>
                                <span class="icon">📄</span>
                                <span class="name">${task}</span>
                            `;

                            taskDiv.onclick = function (e) {
                                e.stopPropagation();
                                selectTask([...currentPath, task].join('/'), task);
                            };

                            taskLi.appendChild(taskDiv);
                            ul.appendChild(taskLi);
                        });
                    } else {
                        // Это объект с папками
                        for (let childKey in value) {
                            ul.appendChild(createNode(childKey, value[childKey], level + 1, currentPath));
                        }
                    }

                    li.appendChild(ul);
                }

                return li;
            }

            // Строим дерево
            for (let key in data) {
                container.appendChild(createNode(key, data[key], 0, []));
            }

            // Подсчитываем общее количество задач
            countAllTasks();
        }

        // Обработка клика на узел
        function handleNodeClick(element, key, value, path) {
            // Убираем выделение со всех
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            element.classList.add('selected');

            // Находим родительский li и переключаем класс expanded
            const li = element.closest('li');
            if (li) {
                li.classList.toggle('expanded');

                // Меняем стрелку
                const arrow = element.querySelector('.arrow');
                if (li.classList.contains('expanded')) {
                    arrow.textContent = '▼';
                } else {
                    arrow.textContent = '▶';
                }
            }

            // Если это уровень с задачами, показываем информацию
            if (Array.isArray(value)) {
                document.getElementById('currentPath').innerHTML = path.join(' → ');
                document.getElementById('currentTitle').innerHTML = `Уровень: ${key}`;
                document.getElementById('taskContent').innerHTML = `
                    <div class="task-info">
                        <h3>Задачи уровня ${key}:</h3>
                        <ul>
                            ${value.map(task => `<li style="margin: 10px 0; cursor: pointer; color: #1976d2;" onclick="selectTask('${path.join('/')}/${task}', '${task}')">📄 ${task}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
        }

        // Выбор конкретной задачи
        window.selectTask = async function (path, taskName) {
            // Убираем выделение со всех
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));

            // Выделяем выбранную задачу
            const taskElement = document.querySelector(`[data-path="${path}"]`);
            if (taskElement) {
                taskElement.classList.add('selected');
            }

            // Показываем путь
            document.getElementById('currentPath').innerHTML = path.split('/').join(' → ');
            document.getElementById('currentTitle').innerHTML = `Загрузка...`;

            // Показываем индикатор загрузки
            document.getElementById('taskContent').innerHTML = `
                <div class="loader-container">
                    <span class="loading"></span> Загрузка задачи...
                </div>
            `;

            try {
                // Загружаем реальное содержимое task.md
                const content = await loadTaskContent(path);

                // Извлекаем ID задачи из первой строки
                const firstLine = content.split('\n')[0];
                const taskIdMatch = firstLine.match(/^#(\d+)/);
                const taskId = taskIdMatch ? taskIdMatch[1] : 'unknown';

                // Конвертируем Markdown в HTML
                const htmlContent = marked.parse(content);

                document.getElementById('currentTitle').innerHTML = `Задача: ${taskName}`;
                document.getElementById('taskContent').innerHTML = `
                    <div>
                        <div class="task-header">
                            <span class="task-id">ID: #${taskId}</span>
                        </div>
                        <div class="markdown-content">
                            ${htmlContent}
                        </div>
                        <a href="/task/${taskId}/" class="btn btn-primary">
                            ✅ Проверить решение этой задачи
                        </a>
                    </div>
                `;
            } catch (error) {
                document.getElementById('currentTitle').innerHTML = `Ошибка`;
                document.getElementById('taskContent').innerHTML = `
                    <div class="error-message">
                        <h3>❌ Ошибка загрузки задачи</h3>
                        <p>Не удалось загрузить файл task.md по пути: ${path}</p>
                        <p>Проверьте, что файл существует и доступен для чтения.</p>
                        <p style="font-size: 12px; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }

            // Предотвращаем всплытие
            event?.stopPropagation();
        };

        // Подсчет всех задач
        function countAllTasks() {
            let total = 0;

            function count(obj) {
                if (Array.isArray(obj)) {
                    total += obj.length;
                } else if (typeof obj === 'object' && obj !== null) {
                    for (let key in obj) {
                        count(obj[key]);
                    }
                }
            }

            count(tasks);
            document.getElementById('totalTasks').textContent = `📊 ${total} задач`;
        }

        // Инициализация
        renderTree(document.getElementById('tree'), tasks);

        // Для демо разворачиваем первый уровень
        setTimeout(() => {
            const firstClass = document.querySelector('.tree > li');
            if (firstClass) {
                firstClass.classList.add('expanded');
                const arrow = firstClass.querySelector('.arrow');
                if (arrow) arrow.textContent = '▼';
            }
        }, 100);
    </script>
