{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    {#    для красивого Python#}
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    {#    Мой файл css #}
    <link rel="stylesheet" href="{% static 'task_description_app/css/temp_tests.css' %}">
{% endblock %}

{% block content %}


    <title>Задачи</title>
    <style>

        .list-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 40px);
        }

        .sidebar {
            width: 400px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 16px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .list-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .list-content-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .list-content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Дерево */
        .tree, .tree ul {
            list-style: none;
            padding-left: 20px;
        }

        .tree {
            padding-left: 0;
        }

        .tree li {
            margin: 2px 0;
        }

        .tree .node {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }

        .tree .node:hover {
            background: #e9ecef;
        }

        .tree .node.selected {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 500;
        }

        .arrow {
            display: inline-block;
            width: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
        }

        .icon {
            margin-right: 8px;
            width: 20px;
            text-align: center;
        }

        .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .count {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
        }

        /* Важно: правильно скрываем дочерние элементы */
        .tree ul {
            display: none;
        }

        .tree li.expanded > ul {
            display: block;
        }

        /* Задача */
        .task-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .empty {
            color: #adb5bd;
            text-align: center;
            padding: 60px 20px;
        }

        .path {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>

    <div class="list-container">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📁 Задачи</span>
                <span id="totalTasks">0</span>
            </div>
            <div class="tree-container">
                <ul class="tree" id="tree"></ul>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="list-content">
            <div class="list-content-header">
                <div class="path" id="currentPath"></div>
                <h2 id="currentTitle">Выберите задачу</h2>
            </div>
            <div class="list-content-body" id="taskContent">
                <div class="empty">
                    👈 Выберите задачу в дереве слева
                </div>
            </div>
        </div>
    </div>



{% endblock %}

{% block extra_js %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <script src="{% static 'task_description_app/js/task_detail.js' %}"></script>

    <script>
        // Данные из structure.json (скопируйте сюда ваш JSON)
        const tasks = {
            "8 класс": {
                "Тема_№1._Программирование": {
                    "Урок_27": {
                        "level_A": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_B": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_C": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ]
                    },
                    "Урок_28": {
                        "level_A": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_B": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_C": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ]
                    }
                },
                "Тема_№2._Сл.програм-ние": {
                    "Урок_31": {
                        "level_A": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_B": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ],
                        "level_C": [
                            "task_001",
                            "task_002",
                            "task_003"
                        ]
                    }
                }
            }
        };

        // Функция для построения дерева
        function renderTree(container, data, parent = null) {
            container.innerHTML = '';

            function createNode(key, value, level = 0, path = []) {
                const li = document.createElement('li');
                const currentPath = [...path, key];
                const pathStr = currentPath.join('/');

                const div = document.createElement('div');
                div.className = 'node';
                div.setAttribute('data-path', pathStr);

                // Определяем иконку
                let icon = '📁';
                if (key.includes('класс')) icon = '📚';
                else if (key.includes('Тема')) icon = '📖';
                else if (key.includes('Урок')) icon = '📝';
                else if (key.includes('level_')) icon = '📊';

                // Стрелка
                const arrow = document.createElement('span');
                arrow.className = 'arrow';

                // Проверяем, есть ли дети
                const hasChildren = Array.isArray(value) ? value.length > 0 :
                    (typeof value === 'object' && value !== null && Object.keys(value).length > 0);

                if (hasChildren) {
                    arrow.textContent = '▶';
                } else {
                    arrow.textContent = '';
                }

                div.appendChild(arrow);

                // Иконка
                const iconSpan = document.createElement('span');
                iconSpan.className = 'icon';
                iconSpan.textContent = icon;
                div.appendChild(iconSpan);

                // Название
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = key;
                div.appendChild(nameSpan);

                // Счетчик для списка задач
                if (Array.isArray(value)) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = value.length;
                    div.appendChild(count);
                }

                div.onclick = function (e) {
                    e.stopPropagation();
                    handleNodeClick(this, key, value, currentPath);
                };

                li.appendChild(div);

                // Добавляем детей
                if (hasChildren) {
                    const ul = document.createElement('ul');

                    if (Array.isArray(value)) {
                        // Это список задач
                        value.forEach(task => {
                            const taskLi = document.createElement('li');
                            const taskDiv = document.createElement('div');
                            taskDiv.className = 'node task';
                            taskDiv.setAttribute('data-path', [...currentPath, task].join('/'));

                            taskDiv.innerHTML = `
                                <span class="arrow"></span>
                                <span class="icon">📄</span>
                                <span class="name">${task}</span>
                            `;

                            taskDiv.onclick = function (e) {
                                e.stopPropagation();
                                selectTask([...currentPath, task].join('/'), task);
                            };

                            taskLi.appendChild(taskDiv);
                            ul.appendChild(taskLi);
                        });
                    } else {
                        // Это объект с папками
                        for (let childKey in value) {
                            ul.appendChild(createNode(childKey, value[childKey], level + 1, currentPath));
                        }
                    }

                    li.appendChild(ul);
                }

                return li;
            }

            // Строим дерево
            for (let key in data) {
                container.appendChild(createNode(key, data[key], 0, []));
            }

            // Подсчитываем общее количество задач
            countAllTasks();
        }

        // Обработка клика на узел
        function handleNodeClick(element, key, value, path) {
            // Убираем выделение со всех
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            element.classList.add('selected');

            // Находим родительский li и переключаем класс expanded
            const li = element.closest('li');
            if (li) {
                li.classList.toggle('expanded');

                // Меняем стрелку
                const arrow = element.querySelector('.arrow');
                if (li.classList.contains('expanded')) {
                    arrow.textContent = '▼';
                } else {
                    arrow.textContent = '▶';
                }
            }

            // Если это уровень с задачами, показываем информацию
            if (Array.isArray(value)) {
                document.getElementById('currentPath').innerHTML = path.join(' → ');
                document.getElementById('currentTitle').innerHTML = `Уровень: ${key}`;
                document.getElementById('taskContent').innerHTML = `
                    <div class="task-info">
                        <h3>Задачи уровня ${key}:</h3>
                        <ul>
                            ${value.map(task => `<li style="margin: 10px 0; cursor: pointer; color: #1976d2;" onclick="selectTask('${path.join('/')}/${task}', '${task}')">📄 ${task}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
        }

        // Выбор конкретной задачи
        window.selectTask = function (path, taskName) {
            // Убираем выделение со всех
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));

            // Выделяем выбранную задачу
            const taskElement = document.querySelector(`[data-path="${path}"]`);
            if (taskElement) {
                taskElement.classList.add('selected');
            }

            // Показываем путь
            document.getElementById('currentPath').innerHTML = path.split('/').join(' → ');
            document.getElementById('currentTitle').innerHTML = `Задача: ${taskName}`;

            // Здесь должен быть переход на страницу задачи
            document.getElementById('taskContent').innerHTML = `
                <div class="task-content">
                    📄 Содержимое файла task.md для задачи ${taskName}

                    Путь: /tasks_for_tests/${path}

                    В реальном проекте здесь будет загружено содержимое task.md
                    или произойдет переход на страницу задачи.

                    ${'='.repeat(40)}

                    # Задача ${taskName}

                    ## Условие:
                    Написать программу, которая...

                    ## Пример ввода:
                    5 3

                    ## Пример вывода:
                    8
                </div>
            `;

            // Предотвращаем всплытие
            event?.stopPropagation();
        };

        // Подсчет всех задач
        function countAllTasks() {
            let total = 0;

            function count(obj) {
                if (Array.isArray(obj)) {
                    total += obj.length;
                } else if (typeof obj === 'object' && obj !== null) {
                    for (let key in obj) {
                        count(obj[key]);
                    }
                }
            }

            count(tasks);
            document.getElementById('totalTasks').textContent = `📊 ${total} задач`;
        }

        // Инициализация
        renderTree(document.getElementById('tree'), tasks);

        // Для демо разворачиваем первый уровень
        setTimeout(() => {
            const firstClass = document.querySelector('.tree > li');
            if (firstClass) {
                firstClass.classList.add('expanded');
                const arrow = firstClass.querySelector('.arrow');
                if (arrow) arrow.textContent = '▼';
            }
        }, 100);
    </script>

{% endblock %}
